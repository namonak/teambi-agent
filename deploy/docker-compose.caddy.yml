# docker-compose.caddy.yml — 장부장 + Caddy(자동 HTTPS)를 한 번에 띄우는 예시.
# 본인 서버에 이 파일로 배포하면 인증서 발급까지 자동으로 끝난다.
#
# 사용:
#   1) 프로젝트 루트에 .env 작성 (cp .env.example .env 후 값 입력)
#   2) deploy/Caddyfile.example → deploy/Caddyfile 로 복사하고 도메인 수정
#      (reverse_proxy 대상은 teambi-agent:49877 로 둔다 — 아래 네트워크 공유)
#   3) docker compose -f docker-compose.yml -f deploy/docker-compose.caddy.yml up -d --build
#
# 80/443 포트가 비어 있어야 한다(기존 웹서버와 충돌 금지).

services:
  teambi-agent:
    # 루트 docker-compose.yml의 teambi-agent 정의를 그대로 재사용.
    # Caddy와 같은 네트워크에 두기 위해 외부 포트 노출은 생략(내부 통신만).
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: teambi-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - teambi-agent

volumes:
  caddy_data:
  caddy_config:
