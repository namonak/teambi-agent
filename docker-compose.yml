services:
  teambi-agent:
    build:
      context: .
      # 커밋 해시는 선택 — 넘기면 기동 로그에 함께 찍힌다.
      #   GIT_SHA=$(git rev-parse HEAD) docker compose up -d --build
      args:
        GIT_SHA: ${GIT_SHA:-}
    # 이름을 명시하지 않으면 <프로젝트>-<서비스> = teambi-agent-teambi-agent가 되어
    # Container Manager 이미지 목록에서 알아보기 어렵다.
    image: teambi-agent:local
    container_name: teambi-agent
    restart: unless-stopped
    ports:
      - '49877:49877'
    # .env의 값을 컨테이너 환경변수로 주입 (비밀값은 이미지에 넣지 않는다)
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
